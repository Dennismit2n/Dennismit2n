  <g stroke="#0d2a18" stroke-width="3.4" stroke-linecap="round">
    <path d="M24 24 L24 9.5"/>
    <path d="M24 24 L36.6 31.2"/>
    <path d="M24 24 L11.4 31.2"/>
  </g>
  <circle cx="24" cy="24" r="3" fill="#0d2a18"/>
</svg>
