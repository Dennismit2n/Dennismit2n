<svg xmlns="http://www.w3.org/2000/svg" width="846" height="514" viewBox="0 0 846 514" role="img" aria-labelledby="at ad">
<title id="at">Die Werkstatt als Mindmap</title><desc id="ad">Die Werkstatt als Mindmap: 21 Werkzeuge in 5 Gruppen. Im Browser: Prismatical, Spectroton, shrinkling, WLAN-QR-Karte, Heizwarte, Hourbridge, Follower-Log, Pocketsum, Zählwerk, Collective-Calc, Dreh das Rad, bigday. Für Windows: Real_RAM_cooler, Besucher-Ticker, Fadenkreuz. Browser + Windows: fontART Designer. Für Claude Code: create-masterprompt, Werkstatt-Mods. Gaming: Craftionary, BL4 Vault-Handbuch, MW4 Rüstkammer.</desc>
