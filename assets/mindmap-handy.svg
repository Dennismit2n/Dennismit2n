<title id="at">Die Werkstatt als Mindmap</title><desc id="ad">Die Werkstatt als Mindmap: 20 Werkzeuge in 5 Gruppen. Im Browser: Prismatical, Spectroton, shrinkling, WLAN-QR-Karte, Heizwarte, Hourbridge, Pocketsum, Zählwerk, Collective-Calc, Dreh das Rad, bigday. Für Windows: Real_RAM_cooler, Besucher-Ticker, Fadenkreuz. Browser + Windows: fontART Designer. Für Claude Code: create-masterprompt, Werkstatt-Mods. Gaming: Craftionary, BL4 Vault-Handbuch, MW4 Rüstkammer.</desc>
