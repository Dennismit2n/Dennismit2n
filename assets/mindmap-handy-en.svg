<title id="at">The workshop as a mind map</title><desc id="ad">The workshop as a mind map: 21 tools in 5 groups. In the browser: Prismatical, Spectroton, shrinkling, WiFi QR Card, Heizwarte, Hourbridge, Follower-Log, Pocketsum, Zählwerk, Collective-Calc, Dreh das Rad, bigday. For Windows: Real_RAM_cooler, Besucher-Ticker, Fadenkreuz. Browser + Windows: fontART Designer. For Claude Code: create-masterprompt, Werkstatt-Mods. Gaming: Craftionary, BL4 Vault-Handbuch, MW4 Rüstkammer.</desc>
