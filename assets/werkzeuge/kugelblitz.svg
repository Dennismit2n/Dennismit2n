<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Kugelblitz: das kleine App-Symbol (favicon.svg der App), Chromkugel mit Blitz in einer Fassung aus Weißgold.
       Die erste Fläche ist ein Vollton, damit readme-bauen.mjs der Profil-README ihr den feinen Rand geben kann;
       der Verlauf der Platte liegt darüber. -->
  <defs>
    <linearGradient id="kb-p" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26254F"/><stop offset="1" stop-color="#121128"/></linearGradient>
    <radialGradient id="kb-c" cx=".66" cy=".3" r=".96" fx=".66" fy=".3">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".07" stop-color="#FFFFFF"/><stop offset=".22" stop-color="#BDB8E6"/>
      <stop offset=".5" stop-color="#6E68A4"/><stop offset=".56" stop-color="#26234B"/><stop offset="1" stop-color="#4A4680"/>
    </radialGradient>
    <linearGradient id="kb-g" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFCEE"/><stop offset=".4" stop-color="#F1E4BC"/><stop offset="1" stop-color="#7A6226"/></linearGradient>
    <linearGradient id="kb-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9E2FF"/><stop offset=".45" stop-color="#75C7FF"/><stop offset="1" stop-color="#AFA1FF"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1C1B3E" stroke="#6E7681" stroke-width="2"/>
  <rect width="64" height="64" rx="14" fill="url(#kb-p)"/>
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="url(#kb-g)" stroke-width="3"/>
  <circle cx="32" cy="32" r="21.5" fill="url(#kb-c)"/>
  <path d="M36.2 12.5 L23.6 33.2 L30.6 33.2 L26.2 51.6 L39.9 28.7 L32.6 28.7 L40.1 12.5 Z" fill="url(#kb-b)" stroke="#F1E4BC" stroke-width="1.3" stroke-linejoin="round"/>
</svg>
